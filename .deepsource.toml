version = 1

exclude_patterns = [
  "node_modules/**",
  ".github/**",
  "public/"
]

test_patterns = [
  "tests/**"
]

[[analyzers]]
name = "test-coverage"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser"]
