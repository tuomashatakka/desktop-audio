version = 1

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser"]

[[analyzers]]
name = "test-coverage"
enabled = true

  [analyzers.meta]
  # DeepSource will auto-detect the format from the file extension
  # clover.xml = Clover XML format (supported by Vitest + v8)
  # lcov.info = LCOV format
  coverage_file = "./coverage/clover.xml"
