name: GitHub Pages

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --legacy-peer-deps

      - name: Build application
        run: bun run package

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create download links info
        run: |
          mkdir -p public
          
          cat > public/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Desktop Audio - Download</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
              }
              .container {
                max-width: 800px;
                padding: 40px;
                text-align: center;
              }
              h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                background: linear-gradient(90deg, #ff5500, #ff7733);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              .subtitle {
                font-size: 1.2rem;
                color: #888;
                margin-bottom: 3rem;
              }
              .download-section {
                background: rgba(255,255,255,0.05);
                border-radius: 16px;
                padding: 30px;
                margin-bottom: 30px;
              }
              .download-links {
                display: flex;
                flex-direction: column;
                gap: 15px;
                margin: 20px 0;
              }
              .download-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 15px 30px;
                background: linear-gradient(90deg, #ff5500, #ff7733);
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
              }
              .download-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(255,85,0,0.3);
              }
              .version {
                color: #666;
                font-size: 0.9rem;
                margin-top: 20px;
              }
              .screenshots {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin-top: 40px;
              }
              .screenshot {
                background: rgba(255,255,255,0.05);
                border-radius: 12px;
                padding: 10px;
              }
              .screenshot img {
                width: 100%;
                border-radius: 8px;
              }
              .screenshot p {
                color: #888;
                margin-top: 10px;
                font-size: 0.9rem;
              }
              footer {
                margin-top: 50px;
                color: #666;
                font-size: 0.8rem;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Desktop Audio</h1>
              <p class="subtitle">A beautiful desktop music player for macOS</p>
              
              <div class="download-section">
                <h2>Download Latest Version</h2>
                <div class="download-links">
                  <a href="https://github.com/tuomashatakka/desktop-audio/releases/latest" class="download-btn">
                    Download for macOS (Apple Silicon)
                  </a>
                  <a href="https://github.com/tuomashatakka/desktop-audio/releases/latest" class="download-btn">
                    Download for macOS (Intel)
                  </a>
                  <a href="https://github.com/tuomashatakka/desktop-audio/releases/latest" class="download-btn">
                    Download for Windows
                  </a>
                </div>
                <p class="version">Version: ${{ github.ref_name }}</p>
              </div>
              
              <div class="screenshots">
                <div class="screenshot">
                  <div style="background: linear-gradient(135deg, #1a1a2e, #16213e); height: 200px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ff5500; font-size: 48px;">
                    ♫
                  </div>
                  <p>Library View with folder tree</p>
                </div>
                <div class="screenshot">
                  <div style="background: linear-gradient(135deg, #1a1a2e, #16213e); height: 200px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ff5500; font-size: 48px;">
                    ▶
                  </div>
                  <p>Now Playing with waveform</p>
                </div>
                <div class="screenshot">
                  <div style="background: linear-gradient(135deg, #1a1a2e, #16213e); height: 200px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ff5500; font-size: 48px;">
                    ⚙
                  </div>
                  <p>Settings</p>
                </div>
              </div>
              
              <footer>
                Built with Electron, React, and TypeScript
              </footer>
            </div>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
