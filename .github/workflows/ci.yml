name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # DeepSource associates coverage with the checked-out commit. Use the
          # PR head instead of GitHub's synthetic merge commit, with a push fallback.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Report coverage to DeepSource
        # Repository secrets are unavailable to workflows from forked PRs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          coverage_report='./coverage/lcov.info'
          test -s "$coverage_report"

          deepsource_cli_dir="${RUNNER_TEMP}/deepsource"
          mkdir -p "$deepsource_cli_dir"
          curl -fsSL https://cli.deepsource.com/install | BINDIR="$deepsource_cli_dir" sh
          "$deepsource_cli_dir/deepsource" report \
            --analyzer test-coverage \
            --key javascript \
            --value-file "$coverage_report" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}"
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

  build:
    # On main, release.yml already builds all four platforms and publishes.
    # Running make here too would just duplicate ~10 minutes of work.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (native module toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun scripts/generate-icon.mjs

      - name: Build application
        run: bun run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audio-artifacts
          path: out/make/**
          retention-days: 7
          if-no-files-found: error
