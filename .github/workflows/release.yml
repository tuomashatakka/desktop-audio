name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# A second push to main while a release is in flight would race on the
# force-pushed `latest` tag. Newest push wins, older run is cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build-matrix:
    needs: [lint-and-typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x64
          - os: macos-latest
            slug: darwin-arm64
          - os: macos-15-intel
            slug: darwin-x64
          - os: windows-latest
            slug: win32-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # electron-forge shells out to node-gyp / electron-rebuild for
      # better-sqlite3, which needs a real Node toolchain — bun alone
      # is not enough for native module compilation.
      - name: Setup Node (native module toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # MakerRpm needs rpmbuild, MakerDeb needs dpkg + fakeroot.
      # Neither rpm nor fakeroot is preinstalled on the ubuntu runner image.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun scripts/generate-icon.mjs

      - name: Configure macOS release signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::warning::MACOS_CERTIFICATE is not configured; this artifact will be ad-hoc signed and cannot pass Gatekeeper automatically"
            exit 0
          fi

          missing=0
          for name in MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured when MACOS_CERTIFICATE is set"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]] || exit 1

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The imported certificate does not contain a Developer ID Application identity"
            exit 1
          fi

          printf 'MACOS_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
          printf 'MACOS_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Build application
        if: runner.os != 'macOS'
        run: bun run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: bun run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS application trust
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find out -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No packaged macOS application was found"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [[ -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
          else
            echo "::warning::$app_path has a valid ad-hoc signature but is not notarized"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d "out/make" ]; then
            find out/make -type f \( \
              -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
              -o -name '*.AppImage' -o -name '*.nupkg' -o -name 'RELEASES' \
            \) -exec cp -f {} artifacts/ \;
          fi
          echo "Artifacts collected on ${{ matrix.slug }}:"
          ls -la artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::No artifacts produced on ${{ matrix.slug }} — make succeeded but out/make is empty"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.slug }}
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build-matrix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: false

      - name: Merge artifacts
        run: |
          mkdir -p final-artifacts
          # Prefix per-platform so same-named files (RELEASES, *.zip) don't clobber
          for dir in all-artifacts/artifacts-*; do
            slug="${dir##*artifacts-}"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              cp -f "$f" "final-artifacts/${slug}-${base}"
            done
          done
          echo "All release artifacts:"
          ls -la final-artifacts/

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${PKG_VERSION}+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update rolling tag
        if: steps.version.outputs.IS_TAG == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      # softprops adds files but never removes stale ones from a previous
      # rolling build, so old SHAs would pile up on the `latest` release.
      - name: Clear stale assets from rolling release
        if: steps.version.outputs.IS_TAG == 'false'
        continue-on-error: true
        run: |
          ids=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true)
          for name in $ids; do
            echo "Deleting stale asset: $name"
            gh release delete-asset latest "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: >-
            ${{ steps.version.outputs.IS_TAG == 'true'
              && format('Desktop Audio {0}', steps.version.outputs.VERSION)
              || format('Latest build ({0})', steps.version.outputs.VERSION) }}
          body: >-
            ${{ steps.version.outputs.IS_TAG == 'true'
              && ''
              || format('Rolling build from `main` @ {0}. Overwritten on every push.', github.sha) }}
          draft: false
          prerelease: ${{ steps.version.outputs.IS_TAG == 'false' || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: ${{ steps.version.outputs.IS_TAG == 'true' }}
          make_latest: ${{ steps.version.outputs.IS_TAG == 'true' }}
          files: final-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
