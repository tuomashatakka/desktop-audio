name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --legacy-peer-deps

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --legacy-peer-deps

      - name: Run tests
        run: bun run test

  build-and-release:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --legacy-peer-deps

      - name: Generate icons
        run: bun scripts/generate-icon.mjs

      - name: Build application
        run: bun run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${PKG_VERSION}+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi

      # For branch pushes: force-update the rolling "latest" tag so the
      # release action has a tag to attach the release to.
      - name: Create or update rolling tag
        if: steps.version.outputs.IS_TAG == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create macOS arm64 artifact
        run: |
          mkdir -p artifacts
          cp out/make/zip/darwin/arm64/*.zip artifacts/ || true

      - name: Create macOS x64 artifact
        run: |
          mkdir -p artifacts
          cp out/make/zip/darwin/x64/*.zip artifacts/ || true

      - name: Create Windows artifact
        run: |
          mkdir -p artifacts
          cp out/make/zip/win32/x64/*.zip artifacts/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: >-
            ${{ steps.version.outputs.IS_TAG == 'true'
              && format('Desktop Audio {0}', steps.version.outputs.VERSION)
              || format('Latest build ({0})', steps.version.outputs.VERSION) }}
          draft: false
          prerelease: ${{ steps.version.outputs.IS_TAG == 'false' || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: ${{ steps.version.outputs.IS_TAG == 'true' }}
          files: |
            out/make/zip/darwin/arm64/*.zip
            out/make/zip/darwin/x64/*.zip
            out/make/zip/win32/x64/*.zip
            out/make/deb/*.deb
            out/make/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
