name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# A second push to main while a release is in flight would race on the
# force-pushed `latest` tag. Newest push wins, older run is cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  build-matrix:
    needs: [lint-and-typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux-x64
          - os: macos-latest
            slug: darwin-arm64
          - os: macos-13
            slug: darwin-x64
          - os: windows-latest
            slug: win32-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # electron-forge shells out to node-gyp / electron-rebuild for
      # better-sqlite3, which needs a real Node toolchain — bun alone
      # is not enough for native module compilation.
      - name: Setup Node (native module toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # MakerRpm needs rpmbuild, MakerDeb needs dpkg + fakeroot.
      # Neither rpm nor fakeroot is preinstalled on the ubuntu runner image.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun scripts/generate-icon.mjs

      - name: Build application
        run: bun run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d "out/make" ]; then
            find out/make -type f \( \
              -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
              -o -name '*.AppImage' -o -name '*.nupkg' -o -name 'RELEASES' \
            \) -exec cp -f {} artifacts/ \;
          fi
          echo "Artifacts collected on ${{ matrix.slug }}:"
          ls -la artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "::error::No artifacts produced on ${{ matrix.slug }} — make succeeded but out/make is empty"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.slug }}
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build-matrix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: false

      - name: Merge artifacts
        run: |
          mkdir -p final-artifacts
          # Prefix per-platform so same-named files (RELEASES, *.zip) don't clobber
          for dir in all-artifacts/artifacts-*; do
            slug="${dir##*artifacts-}"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              cp -f "$f" "final-artifacts/${slug}-${base}"
            done
          done
          echo "All release artifacts:"
          ls -la final-artifacts/

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${PKG_VERSION}+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "TAG=latest" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update rolling tag
        if: steps.version.outputs.IS_TAG == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      # softprops adds files but never removes stale ones from a previous
      # rolling build, so old SHAs would pile up on the `latest` release.
      - name: Clear stale assets from rolling release
        if: steps.version.outputs.IS_TAG == 'false'
        continue-on-error: true
        run: |
          ids=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true)
          for name in $ids; do
            echo "Deleting stale asset: $name"
            gh release delete-asset latest "$name" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: >-
            ${{ steps.version.outputs.IS_TAG == 'true'
              && format('Desktop Audio {0}', steps.version.outputs.VERSION)
              || format('Latest build ({0})', steps.version.outputs.VERSION) }}
          body: >-
            ${{ steps.version.outputs.IS_TAG == 'true'
              && ''
              || format('Rolling build from `main` @ {0}. Overwritten on every push.', github.sha) }}
          draft: false
          prerelease: ${{ steps.version.outputs.IS_TAG == 'false' || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: ${{ steps.version.outputs.IS_TAG == 'true' }}
          make_latest: ${{ steps.version.outputs.IS_TAG == 'true' }}
          files: final-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
